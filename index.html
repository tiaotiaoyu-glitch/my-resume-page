<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历</title>
    <link rel="stylesheet" href="css/mn.css">
</head>
<body>
    <div class="resume-container">
        <!-- 第一部分：基本信息 -->
        <section class="section basic-info">
            <div class="info-content">
                <div class="info-left">
                    <div class="info-item">
                        <span class="label">姓名：</span>
                        <span class="value">你的姓名</span>
                    </div>
                    <div class="info-item">
                        <span class="label">电话：</span>
                        <span class="value">你的电话</span>
                    </div>
                    <div class="info-item">
                        <span class="label">性别：</span>
                        <span class="value">你的性别</span>
                    </div>
                    <div class="info-item">
                        <span class="label">邮箱：</span>
                        <span class="value">你的邮箱</span>
                    </div>
                </div>
                <div class="info-right">
                    <div class="info-item">
                        <span class="label">民族：</span>
                        <span class="value">你的民族</span>
                    </div>
                    <div class="info-item">
                        <span class="label">专业：</span>
                        <span class="value">你的专业</span>
                    </div>
                    <div class="info-item">
                        <span class="label">出生年月：</span>
                        <span class="value">你的出生年月</span>
                    </div>
                    <div class="info-item">
                        <span class="label">毕业时间：</span>
                        <span class="value">你的毕业时间</span>
                    </div>
                    <div class="info-item">
                        <span class="label">政治面貌：</span>
                        <span class="value">你的政治面貌</span>
                    </div>
                    <div class="info-item">
                        <span class="label">毕业院校：</span>
                        <span class="value">你的毕业院校</span>
                    </div>
                </div>
            </div>
            <div class="photo">
                <!-- 把你的照片放到 zhaopian 文件夹里，替换文件名即可 -->
                <img src="zhaopian/95D8653C0A0C34930609A9E3DFA39909.jpg" alt="个人照片">
            </div>
        </section>

        <!-- 第二部分：教育背景 -->
        <section class="section">
            <h2 class="section-title">教育背景</h2>
            <ul class="list-content">
                <li>这里写你的教育背景1</li>
                <li>这里写你的教育背景2</li>
            </ul>
        </section>

        <!-- 第三部分：实践经历（含视频） -->
        <section class="section">
            <h2 class="section-title">实践经历</h2>
            <ul class="list-content">
                <li>这里写你的实践经历1</li>
                <li>这里写你的实践经历2</li>
            </ul>
            <!-- 视频放在 shipin 文件夹里，替换文件名即可 -->
            <div class="video-container">
                <video controls width="100%">
                    <source src="shipin/482ba2090458aec719d25b00cf0e3a06.mp4" type="video/mp4">
                    你的浏览器不支持视频播放
                </video>
            </div>
        </section>

        <!-- 第四部分：校园经历 -->
        <section class="section">
            <h2 class="section-title">校园经历</h2>
            <ul class="list-content">
                <li><li><a href="https://code.visualstudio.com/" target="_blank">11111111111111</a></li>
                <li>这里写你的校园经历2</li>
            </ul>
        </section>

        <!-- 第五部分：技能与自我评价 -->
        <section class="section">
            <h2 class="section-title">技能与自我评价</h2>
            <div class="self-evaluation">
                <p>这里写你的自我评价内容</p>
            </div>
            <ul class="list-content">
                <li>技能1</li>
                <li>技能2</li>
            </ul>
        </section>
    </div>
</body>
</html>
